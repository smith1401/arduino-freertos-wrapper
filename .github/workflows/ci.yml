name: CI

on:
  push:
  pull_request:

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: library.json, library.properties and CHANGELOG.md agree
        run: python3 scripts/version.py check

  host-tests:
    name: Host tests (FreeRTOS POSIX port, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S test/host -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      - name: Test
        # Repeat to catch timing dependent problems
        run: ctest --test-dir build --output-on-failure --repeat until-fail:5

  examples:
    name: ${{ matrix.example }} (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [esp32, stm32, nrf52]
        example: [BasicTasks, PubSub, InputService, QueueSet]
        exclude:
          # Queue sets are disabled in the default STM32 / nRF52 FreeRTOS configs
          - env: stm32
            example: QueueSet
          - env: nrf52
            example: QueueSet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('library.json', 'test/platformio/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        env:
          FRT_LIB_DIR: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/proj/src
          cp examples/${{ matrix.example }}/${{ matrix.example }}.ino /tmp/proj/src/main.cpp
          cp test/platformio/platformio.ini /tmp/proj/
          if [ "${{ matrix.env }}" != "stm32" ]; then
            # Worst case: STM32FreeRTOS is visible to the build (e.g. as a
            # global library). It must still not be picked up on this platform.
            git clone -q --depth 1 https://github.com/stm32duino/STM32FreeRTOS.git /tmp/proj/lib/STM32FreeRTOS
          fi
          # -v prints the complete dependency graph (which library pulls in which)
          pio run -v -d /tmp/proj -e ${{ matrix.env }} 2>&1 | tee /tmp/build.log
          exit "${PIPESTATUS[0]}"

      - name: Only the platform's own FreeRTOS is built
        # Only the dependency scan decides whether an installed / visible
        # library is used; it must not select STM32FreeRTOS here
        if: matrix.env != 'stm32'
        run: |
          # Installing it is fine, using it is not
          if grep -nE '\|-- STM32duino FreeRTOS|Compiling .*STM32FreeRTOS|STM32FreeRTOS/.*\.o$' /tmp/build.log; then
            echo "::error::STM32FreeRTOS was compiled for ${{ matrix.env }}"
            exit 1
          fi
