; Builds one example against the library checked out in $GITHUB_WORKSPACE
; (or FRT_LIB_DIR). Used by CI, see .github/workflows/ci.yml:
;
;   mkdir -p /tmp/proj/src && cp examples/PubSub/PubSub.ino /tmp/proj/src/main.cpp
;   cp test/platformio/platformio.ini /tmp/proj/ && pio run -d /tmp/proj -e esp32

[env]
framework = arduino
lib_deps = symlink://${sysenv.FRT_LIB_DIR}
lib_ldf_mode = deep+
build_flags = -Wall

[env:esp32]
platform = espressif32
board = esp32dev

[env:stm32]
platform = ststm32
board = nucleo_f401re

[env:nrf52]
platform = nordicnrf52
board = adafruit_feather_nrf52840
